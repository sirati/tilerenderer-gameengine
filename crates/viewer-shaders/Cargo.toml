[package]
name = "viewer-shaders"
description = "The viewer's one rust-gpu shader module: links the tile renderer's, the glass lens's and the selection marker's shaders (built by viewer-spirv's build script)"
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[lib]
crate-type = ["dylib", "lib"]

[dependencies]
spirv-std = "0.11"
tile-render-shaders = { path = "../tile-render-shaders" }
glass-shaders = { path = "../glass-shaders" }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))'] }
