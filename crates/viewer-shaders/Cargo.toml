
[package]
name = "viewer-shaders"
description = "Generic viewer shader module combining tile and selection marker entry points"
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[lib]
crate-type = ["dylib", "lib"]

[dependencies]
spirv-std = "0.11"

[dependencies.tile-render-shaders]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[dependencies.marker-shaders]
path = "../marker-shaders"

[dependencies.tile-render-shared]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[lints]

[lints.rust]

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ["cfg(target_arch, values(\"spirv\"))"]
