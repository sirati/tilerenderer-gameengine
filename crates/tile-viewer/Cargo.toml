[package]
name = "tile-viewer"
description = "Game-agnostic window that renders scene snapshots with a render description and reports input"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
render-errors = { path = "../render-errors" }
application-icon = { path = "../application-icon" }
handoff = { path = "../handoff" }
tile-render.workspace = true
# (Not `glass`: the viewer has a module of that name, its frosted divider.)
glass-lens = { package = "glass", path = "../glass" }
marker = { path = "../marker" }
viewer-spirv.workspace = true
render-desc = { path = "../render-desc" }
scene = { path = "../scene" }
viewer-settings = { path = "../viewer-settings" }
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
log.workspace = true
thiserror.workspace = true
pointer-control = { path = "../pointer-control" }
function-keys = { path = "../function-keys" }

[target.'cfg(target_os = "macos")'.dependencies]
softbuffer = { version = "0.4.8", default-features = false }
# Scheduling the window onto the main thread of a host application.
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
toml = "0.9"
