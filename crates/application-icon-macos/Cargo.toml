
[package]
name = "application-icon-macos"
description = "AppKit application icon backend"

[package.edition]
workspace = true

[package.license]
workspace = true

[package.version]
workspace = true

[target]

[target."cfg(target_os = \"macos\")"]

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"

[target."cfg(target_os = \"macos\")".dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = ["std", "NSApplication", "NSImage", "NSResponder"]

[target."cfg(target_os = \"macos\")".dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSData"]

[target."cfg(target_os = \"macos\")".dependencies.thiserror]
workspace = true

[target."cfg(target_os = \"macos\")".dev-dependencies]

[target."cfg(target_os = \"macos\")".dev-dependencies.image]
workspace = true

[target."cfg(target_os = \"macos\")".dev-dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = ["NSBitmapImageRep", "NSImageRep", "NSColor", "NSColorSpace", "objc2-core-foundation"]
