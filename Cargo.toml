
[workspace]
resolver = "3"
members = ["crates/application-icon", "crates/application-icon-macos", "crates/function-keys", "crates/function-keys-macos", "crates/marker", "crates/viewer-spirv", "crates/render-desc", "crates/scene", "crates/menu", "crates/tile-viewer", "crates/viewer-settings", "crates/viewer-transport", "crates/tile-game"]
exclude = ["crates/marker-shaders", "crates/viewer-shaders", "vendor"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
winit = "0.30"
pollster = "0.4"
thiserror = "2"

[workspace.dependencies.tile-render-shared]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[workspace.dependencies.tile-render]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[workspace.dependencies.viewer-spirv]
path = "crates/viewer-spirv"

[workspace.dependencies.wgpu]
version = "30"
features = ["spirv", "vulkan-portability"]

[workspace.dependencies.log]
version = "0.4"
features = ["std"]

[workspace.dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

[profile]

[profile.dev]

[profile.dev.package]

[profile.dev.package."*"]
opt-level = 2

[patch]

[patch.crates-io]

[patch.crates-io.wgpu-hal]
git = "ssh://git@github.com/sirati/tilerenderer.git"
rev = "6941948fc77ad310c9021df6f01374be9d3a23fc"

[patch.crates-io.winit]
git = "ssh://git@github.com/sirati/pointer-control-rs.git"
rev = "10c22945ee0a9c23084cb85035a1ee44432cabd5"
