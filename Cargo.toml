[workspace]
resolver = "3"
members = [
    "crates/application-icon",
    "crates/application-icon-macos",
    "crates/function-keys",
    "crates/function-keys-macos",
    "crates/pointer-x11",
    "crates/pointer-wayland",
    "crates/pointer-windows",
    "crates/pointer-macos",
    "crates/pointer-fallback",
    "crates/pointer-control",
    "crates/pointer-api",
    "crates/tile-render-shared",
    "crates/tile-render",
    "crates/civ3-assets",
    "crates/render-desc",
    "crates/render-errors",
    "crates/scene",
    "crates/menu",
    "crates/gdi-text",
    "crates/gpu-text",
    "crates/wine-unixlib",
    "crates/wl-pointer",
    "crates/civ3r-native",
    "crates/tile-viewer",
    "crates/viewer-settings",
    "crates/viewer-transport",
    "crates/civ3r-viewer",
    "crates/civ3r-launcher",
    "crates/civ3r-process",
    "crates/civ3r-sync",
    "crates/inproc",
    "crates/civ3-sys",
    "crates/jgl",
    "crates/jgl-ffi",
    "crates/civ3-ui",
    "crates/civ3-bridge",
]
# The shader crate is compiled by rust-gpu (pinned nightly) from
# tile-render's build script, never by the workspace toolchain.
exclude = ["crates/tile-render-shaders", "vendor"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
tile-render-shared = { path = "crates/tile-render-shared" }
tile-render = { path = "crates/tile-render" }
gpu-text = { path = "crates/gpu-text" }
bytemuck = { version = "1.24", features = ["derive", "min_const_generics"] }
glam = "0.30"
wgpu = { version = "30", features = ["spirv", "vulkan-portability"] }
winit = "0.30"
pollster = "0.4"
log = { version = "0.4", features = ["std"] }
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 2

# wgpu-hal with a fix for DX12 in 32-bit processes (pipeline stream
# subobject alignment), see vendor/wgpu-hal/src/dx12/pipeline_desc.rs.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
winit = { path = "vendor/winit" }
